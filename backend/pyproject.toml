[project]
name = "agentops-lite"
version = "0.1.0"
description = "Multi-agent GitHub repository investigation service"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added phase by phase to keep each phase reviewable.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
